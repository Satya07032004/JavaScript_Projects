<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analog CLock</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="clock">
      <div class="num" style="--v: 1"><span>.</span></div>
      <div class="num" style="--v: 2"><span>.</span></div>
      <div class="num" style="--v: 3"><span>3</span></div>
      <div class="num" style="--v: 4"><span>.</span></div>
      <div class="num" style="--v: 5"><span>.</span></div>
      <div class="num" style="--v: 6"><span>6</span></div>
      <div class="num" style="--v: 7"><span>.</span></div>
      <div class="num" style="--v: 8"><span>.</span></div>
      <div class="num" style="--v: 9"><span>9</span></div>
      <div class="num" style="--v: 10"><span>.</span></div>
      <div class="num" style="--v: 11"><span>.</span></div>
      <div class="num" style="--v: 12"><span>12</span></div>
      <div class="dot"></div>
      <div class="digi-clock">
        <div class="dh">00</div>
        :
        <div class="dm">00</div>
        :
        <div class="ds">00</div>
      </div>
      <div class="hour-hand"></div>
      <div class="min-hand"></div>
      <div class="sec-hand"></div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
